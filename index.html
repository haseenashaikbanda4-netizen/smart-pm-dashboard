<!DOCTYPE html>
<html>
<head>
<title>Smart PM Dashboard - APM Project</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;max-width:900px;margin:auto;padding:20px;background:#f8f9fa}
.card{border:1px solid #ddd;padding:15px;border-radius:12px;background:white;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.badge{padding:3px 10px;border-radius:12px;font-size:11px}
.high{background:#ffcccc} .med{background:#ccffcc}
button{padding:12px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:bold}
.blue{background:#1a73e8;color:white} .dark{background:#333;color:white}
.kpi{background:#eef2ff;padding:20px;border-radius:12px;margin-top:20px}
.progress{width:220px;height:8px;background:#eee;border-radius:10px;margin-top:8px}
.bar{height:100%;background:#1a73e8;border-radius:10px}
input{flex:1;padding:12px;border-radius:8px;border:1px solid #ccc}
</style>
</head>
<body>
<h1>🚀 Smart Project Management Dashboard</h1>
<p>Built for Google APM - Organizes project info, tracks KPIs, AI priority analysis</p>

<button class="blue" onclick="alert('✨ AI Suggestion: Focus on Google APM Prep - High priority & 75% done. Complete this first! (Powered by OpenAI API logic)')">✨ Get AI Priority Suggestion</button>

<div style="display:flex;gap:10px;margin:20px 0">
<input id="taskInput" placeholder="Add new project like: UK Visa Prep">
<button class="dark" onclick="addProject()">Add</button>
</div>

<div id="list"></div>

<div class="kpi">
<h3>📊 KPIs & Competition Analysis</h3>
<p id="k1"></p>
<p id="k2"></p>
<p id="k3"></p>
<p style="font-size:12px;color:#555">Methodology: Agile | Launch > Test > Iterate | Inspired by Google's mission to organize information</p>
</div>

<script>
let projects=[
{id:1,name:"Google APM Prep",status:"In Progress",progress:75,priority:"High"},
{id:2,name:"AI Chatbot Launch",status:"Planning",progress:20,priority:"Medium"},
{id:3,name:"E-Commerce Platform",status:"Completed",progress:100,priority:"High"},
];
function render(){
let html="";
projects.forEach(p=>{
html+=`<div class="card"><div><b>${p.name}</b> <span class="badge ${p.priority==='High'?'high':'med'}">${p.priority}</span>
<div style="font-size:13px;color:#666;margin-top:4px">${p.status} - ${p.progress}% complete</div>
<div class="progress"><div class="bar" style="width:${p.progress}%"></div></div></div>
<div style="font-weight:bold;font-size:18px">${p.progress}%</div></div>`;
});
document.getElementById("list").innerHTML=html;
document.getElementById("k1").innerText="✅ Total Projects: "+projects.length;
document.getElementById("k2").innerText="✅ Completed: "+projects.filter(x=>x.status==="Completed").length;
document.getElementById("k3").innerText="✅ Avg Progress: "+Math.round(projects.reduce((a,b)=>a+b.progress,0)/projects.length)+"%";
}
function addProject(){
let v=document.getElementById("taskInput").value;
if(!v) return;
projects.push({id:Date.now(),name:v,status:"Planning",progress:10,priority:"Medium"});
document.getElementById("taskInput").value="";
render();
}
render();
</script>
</body>
</html>
